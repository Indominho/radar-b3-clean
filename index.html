<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar B3 IA Clean</title><style>body{font:16px system-ui;margin:0;background:#eef7f5;color:#123}main{max-width:1200px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(2rem,5vw,4rem);line-height:1}.notice,.panel{background:#fff;border:1px solid #c8ded9;border-radius:12px;padding:18px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:16px;background:#e5f4f0;border-radius:8px}.metric small{display:block;color:#567}.metric b{font-size:1.5rem}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:10px;border-bottom:1px solid #d5e5e2;text-align:right}th:first-child,td:first-child{text-align:left}button{padding:10px 14px;border:1px solid #0a8679;border-radius:8px;background:#fff;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:16px}}</style><main><header><strong>RADAR B3 IA CLEAN <small>v2.0.0</small></strong><span id="status">Carregando</span></header><section class="notice"><b>Base limpa, sem herança de dados antigos.</b><p id="message">Carregando catálogo atual...</p></section><div class="grid"><div class="metric"><small>Ações no catálogo</small><b id="count">0</b></div><div class="metric"><small>Última atualização</small><b id="updated">-</b></div><div class="metric"><small>Ranking fundamentalista</small><b id="rankCount">0</b></div><div class="metric"><small>Política</small><b>Sem inventar</b></div></div><section class="panel"><h2>Catálogo atual</h2><input id="q" placeholder="Buscar ticker ou empresa" style="padding:10px;width:100%;box-sizing:border-box"><table><thead><tr><th>Ativo</th><th>Preço</th><th>Variação</th><th>Fonte</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>let data=[];const $=s=>document.querySelector(s),fmt=v=>typeof v==='number'?v.toLocaleString('pt-BR',{maximumFractionDigits:2}):'Não publicado pela fonte';async function load(){try{let t=Date.now(),c=await(await fetch('data/catalog.json?'+t)).json(),r=await(await fetch('data/ranking.json?'+t)).json();data=c.items||[];$('#count').textContent=data.length;$('#rankCount').textContent=r.items?.length||0;$('#updated').textContent=new Date(c.updated_at).toLocaleString('pt-BR');$('#message').textContent='Catálogo reconstruído do zero; indicadores aparecem só quando publicados e validados.';$('#status').textContent='v2.0.0 carregada';render()}catch(e){$('#status').textContent='Falha de carga';$('#message').textContent='Não foi possível carregar a base publicada.'}}function render(){let q=$('#q').value.toLowerCase(),a=data.filter(x=>`${x.ticker} ${x.name||''}`.toLowerCase().includes(q)).slice(0,100);$('#rows').innerHTML=a.map(x=>`<tr><td><b>${x.ticker}</b><br><small>${x.name||''}</small></td><td>${fmt(x.price)}</td><td>${fmt(x.change)}%</td><td>${x.source||'brapi'}</td></tr>`).join('')}$('#q').oninput=render;load()</script></html>
